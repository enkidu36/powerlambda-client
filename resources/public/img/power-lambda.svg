<svg width="520" height="140" viewBox="0 0 520 140" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0b1220"></rect>

  <!-- Gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"></stop>
      <stop offset="100%" stop-color="#3b82f6"></stop>
    </linearGradient>
  </defs>

  <!-- Text: Power -->
  <text x="60" y="85" font-family="Inter, sans-serif" font-size="56" font-weight="500" fill="#f9fafb" letter-spacing="0.5">
    Power
  </text>

  <!-- Lambda (refined to match image style) -->
  <path d="
    M330 30
    L375 110
    Q380 120 365 120
    L345 120
    L315 55
    L285 120
    L265 120
    Q250 120 255 110
    L300 30
    Z" fill="#f9fafb"></path>

  <!-- Arc (subtle orbit feel) -->
  <path d="
    M315 40
    Q400 20 430 70" stroke="url(#grad)" stroke-width="4" fill="none" stroke-linecap="round"></path>

  <!-- Node -->
  <circle cx="430" cy="70" r="6" fill="url(#grad)"></circle>

</svg>